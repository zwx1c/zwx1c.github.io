<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
    <title>摆摊全能管家 · 库存+记账</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background:#f7f3ee; min-height:100vh; padding:12px; display:flex; justify-content:center; }
        .app { width:100%; max-width:600px; }
        .card { background:white; border-radius:24px; padding:18px; margin-bottom:12px; box-shadow:0 8px 20px rgba(120,70,30,0.06); }
        .stats-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; }
        .stat-item { flex:1; min-width:80px; text-align:center; background:#fefaf4; border-radius:16px; padding:10px 6px; }
        .stat-val { font-weight:700; font-size:1.2rem; color:#4b3825; }
        .stat-label { font-size:0.7rem; color:#a4907c; }
        .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
        .sale-btn { background:#fffdf9; border:1px solid #e2cfb6; border-radius:18px; padding:14px 6px; font-weight:700; font-size:0.9rem; color:#5e4630; box-shadow:0 4px 10px rgba(140,100,60,0.06); cursor:pointer; text-align:center; }
        .sale-btn:active { background:#f3e4d4; transform:scale(0.97); }
        .sale-btn .sub { font-size:0.7rem; color:#b39274; font-weight:500; display:block; }
        .sale-list { max-height:200px; overflow-y:auto; margin-bottom:8px; }
        .sale-item { display:flex; justify-content:space-between; align-items:center; padding:8px 4px; border-bottom:1px solid #f2e5d6; font-size:0.85rem; }
        .sale-detail { color:#b7a089; font-size:0.75rem; }
        .toolbar { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
        .search-input { flex:2; min-width:120px; padding:10px 14px; border:1px solid #e2cfb6; border-radius:30px; font-size:0.9rem; background:#fffdf9; }
        .filter-select { flex:1; padding:10px 8px; border:1px solid #e2cfb6; border-radius:30px; font-size:0.9rem; background:#fffdf9; }
        .table-wrap { overflow-x:auto; border-radius:16px; border:1px solid #f0e1d0; }
        table { width:100%; border-collapse:collapse; font-size:0.8rem; min-width:650px; }
        th { background:#f7efe5; padding:12px 6px; text-align:left; font-weight:700; color:#4f3b2a; border-bottom:2px solid #d9c2a6; }
        td { padding:10px 6px; border-bottom:1px solid #f2e5d6; vertical-align:middle; }
        .editable { width:70px; padding:6px; border:1px solid #e0cfb8; border-radius:10px; text-align:center; background:#fffdf8; }
        .action-cell { display:flex; gap:4px; flex-wrap:wrap; }
        .icon-btn { background:#f9f3ea; border:1px solid #e2cfb6; border-radius:16px; padding:5px 10px; font-size:0.75rem; font-weight:600; color:#5e402b; cursor:pointer; }
        .icon-btn.danger { color:#b34a4a; border-color:#e6c5c0; }
        .pagination { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:12px; }
        .page-btn { background:white; border:1px solid #ddceba; border-radius:20px; padding:8px 16px; font-weight:600; cursor:pointer; color:#5e4630; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); justify-content:center; align-items:center; z-index:300; }
        .modal-overlay.active { display:flex; }
        .modal-box { background:white; border-radius:28px; padding:20px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto; box-shadow:0 30px 50px rgba(80,40,20,0.25); }
        .modal-title { font-weight:700; font-size:1.1rem; color:#4b3825; margin-bottom:16px; text-align:center; }
        .select-list { max-height:250px; overflow-y:auto; margin-bottom:12px; }
        .select-option { padding:12px; border-bottom:1px solid #f0e3d2; cursor:pointer; font-size:0.9rem; border-radius:12px; transition:0.1s; user-select:none; }
        .select-option.selected { background:#f0e4d4; font-weight:700; }
        .modal-actions { display:flex; gap:10px; justify-content:space-between; }
        .btn { padding:12px 20px; border-radius:24px; border:1px solid #ddceba; background:#fffdf9; font-weight:600; cursor:pointer; font-size:0.9rem; }
        .btn.primary { background:#6b4c3b; color:white; border:none; }
        .btn.small { padding:6px 12px; font-size:0.8rem; border-radius:16px; }
        .history-day { background:#fdfaf5; border-radius:12px; padding:10px; margin-bottom:10px; cursor:pointer; border:1px solid #f0e1d0; }
        .history-transaction { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #f0e3d2; font-size:0.85rem; }
        .edit-input { width:70px; padding:4px; border:1px solid #ddceba; border-radius:8px; text-align:center; }
    </style>
</head>
<body>
<div class="app">
    <div class="card">
        <div class="stats-row" id="statsContainer"></div>
    </div>

    <div class="card">
        <div style="font-weight:700; margin-bottom:10px; color:#4b3825;">🧾 今日记账</div>
        <div class="btn-grid">
            <button class="sale-btn" onclick="openSaleModal('免胶',9.9)">👁️ 免胶睫毛<span class="sub">¥9.90</span></button>
            <button class="sale-btn" onclick="openSaleModal('胶水',6.9)">💧 胶水睫毛<span class="sub">¥6.90</span></button>
            <button class="sale-btn" onclick="openComboModal()">🎁 任选两盒<span class="sub">¥16.00</span></button>
            <button class="sale-btn" onclick="openSaleModal('发圈单',8.8)">🎀 发圈 ×1<span class="sub">¥8.80</span></button>
            <button class="sale-btn" onclick="openSaleModal('发圈双',15)">🎀🎀 发圈 ×2<span class="sub">¥15.00</span></button>
            <button class="sale-btn" onclick="openSaleModal('镊子',2)">🔧 镊子<span class="sub">¥2.00</span></button>
        </div>
        <div style="font-size:0.7rem;color:#b7a089;margin-bottom:8px;text-align:center;">💡 镊子一般不单卖，买睫毛加购请用「✏️ 自定义」</div>
        <div class="sale-list" id="saleList"><div style="text-align:center;color:#c5b29b;padding:14px;">暂无销售记录</div></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn" onclick="undoLastSale()" style="flex:1;">↩️ 撤销</button>
            <button class="btn" onclick="addCustom()" style="flex:1;">✏️ 自定义</button>
            <button class="btn primary" onclick="settleDay()" style="flex:1;">📋 结算</button>
        </div>
    </div>

    <div class="card">
        <div style="font-weight:700; margin-bottom:10px; color:#4b3825;">📦 库存管理</div>
        <div class="toolbar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索名称..." oninput="renderStock()">
            <select class="filter-select" id="categoryFilter" onchange="renderStock()">
                <option value="全部">📦 全部</option>
                <option value="假睫毛">👁️ 假睫毛</option>
                <option value="发圈">🎀 发圈</option>
                <option value="工具">🔧 工具</option>
            </select>
            <button class="btn" onclick="openAddModal()">➕ 添加</button>
        </div>
        <div class="table-wrap" id="stockTable"></div>
        <div class="pagination" id="pagination"></div>
        <button class="btn" style="margin-top:12px; width:100%;" onclick="openHistoryModal()">📚 历史账单</button>
    </div>
</div>

<div class="modal-overlay" id="selectionModal">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">选择款式</div>
        <div class="select-list" id="modalOptions"></div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn primary" id="modalConfirm">确认</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <div class="modal-title" id="editModalTitle">添加商品</div>
        <input type="hidden" id="editId">
        <select id="editCategory" style="width:100%; padding:12px; border-radius:16px; border:1px solid #ddceba; margin-bottom:12px;">
            <option value="假睫毛">假睫毛</option>
            <option value="发圈">发圈</option>
            <option value="工具">工具</option>
        </select>
        <input type="text" id="editName" placeholder="商品名称" style="width:100%; padding:12px; border-radius:16px; border:1px solid #ddceba; margin-bottom:12px;">
        <input type="text" id="editSpec" placeholder="规格 (选填)" style="width:100%; padding:12px; border-radius:16px; border:1px solid #ddceba; margin-bottom:12px;">
        <input type="number" id="editCost" placeholder="进货单价" step="0.01" style="width:100%; padding:12px; border-radius:16px; border:1px solid #ddceba; margin-bottom:12px;">
        <input type="number" id="editQty" placeholder="库存数量" value="1" style="width:100%; padding:12px; border-radius:16px; border:1px solid #ddceba; margin-bottom:12px;">
        <input type="text" id="editNote" placeholder="备注 (选填)" style="width:100%; padding:12px; border-radius:16px; border:1px solid #ddceba; margin-bottom:12px;">
        <div class="modal-actions">
            <button class="btn" onclick="closeEditModal()">取消</button>
            <button class="btn primary" onclick="saveProduct()">保存</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="historyModal">
    <div class="modal-box" style="max-width:500px;">
        <div class="modal-title">📅 历史账单</div>
        <div id="historyList" style="max-height:60vh; overflow-y:auto;"></div>
        <button class="btn" style="width:100%; margin-top:12px;" onclick="closeHistoryModal()">关闭</button>
    </div>
</div>

<script>
    (function() {
        const DEFAULT_PRODUCTS = [
            {id:1, cat:"假睫毛", name:"新中式下睫毛", spec:"10排/5-6mm", cost:25.75, qty:6, sold:0, note:"整单实付"},
            {id:2, cat:"假睫毛", name:"双尖太阳花(胶水)", spec:"10排/胶水", cost:2.89, qty:2, sold:0, note:""},
            {id:3, cat:"假睫毛", name:"浓密九尾兔(胶水)", spec:"10排/胶水", cost:3.19, qty:2, sold:0, note:""},
            {id:4, cat:"假睫毛", name:"娥(胶水)", spec:"10排/胶水", cost:3.18, qty:2, sold:0, note:""},
            {id:5, cat:"假睫毛", name:"犬系汪汪狗(胶水)", spec:"10排/胶水", cost:3.33, qty:2, sold:0, note:""},
            {id:6, cat:"假睫毛", name:"云朵小恶魔", spec:"10排/免胶", cost:4.28, qty:3, sold:0, note:""},
            {id:7, cat:"假睫毛", name:"犬系汪汪狗(免胶)", spec:"10排/免胶", cost:4.08, qty:3, sold:0, note:""},
            {id:8, cat:"假睫毛", name:"娥(免胶)", spec:"10排/免胶", cost:4.28, qty:2, sold:0, note:""},
            {id:9, cat:"假睫毛", name:"富家千金", spec:"10排/免胶", cost:3.88, qty:2, sold:0, note:""},
            {id:10, cat:"假睫毛", name:"自然猫精灵", spec:"10排/免胶", cost:3.88, qty:2, sold:0, note:""},
            {id:11, cat:"假睫毛", name:"懒人三部曲", spec:"10排/免胶", cost:3.78, qty:3, sold:0, note:""},
            {id:12, cat:"假睫毛", name:"山茶花", spec:"10排/免胶", cost:4.18, qty:3, sold:0, note:""},
            {id:13, cat:"假睫毛", name:"向日葵", spec:"10排/免胶", cost:4.08, qty:2, sold:0, note:""},
            {id:14, cat:"假睫毛", name:"自然秋枫叶", spec:"10排/免胶", cost:4.08, qty:2, sold:0, note:""},
            {id:15, cat:"假睫毛", name:"猫爪下睫毛", spec:"10排/免胶", cost:4.08, qty:3, sold:0, note:""},
            {id:16, cat:"假睫毛", name:"狐系苏妲己", spec:"10排/免胶", cost:3.88, qty:2, sold:0, note:""},
            {id:17, cat:"假睫毛", name:"芭比小野兔", spec:"10排/免胶", cost:4.28, qty:3, sold:0, note:""},
            {id:18, cat:"假睫毛", name:"太阳花", spec:"10排/免胶", cost:3.78, qty:3, sold:0, note:""},
            {id:19, cat:"假睫毛", name:"双尖太阳花(免胶)", spec:"10排/免胶", cost:4.08, qty:2, sold:0, note:""},
            {id:20, cat:"假睫毛", name:"女团ace", spec:"10排/免胶", cost:3.78, qty:2, sold:0, note:""},
            {id:21, cat:"假睫毛", name:"浓密九尾兔(免胶)", spec:"10排/免胶", cost:4.28, qty:2, sold:0, note:""},
            {id:22, cat:"工具", name:"不粘胶镊子", spec:"黑色喷漆", cost:12.66, qty:19, sold:0, note:""},
            {id:23, cat:"发圈", name:"藏蓝格纹爱心蕾丝", spec:"约15cm", cost:4.09, qty:1, sold:0, note:""},
            {id:24, cat:"发圈", name:"黑白格纹拼接蕾丝", spec:"四层15cm", cost:2.23, qty:1, sold:0, note:""},
            {id:25, cat:"发圈", name:"米色缎面波点", spec:"四层15cm", cost:3.04, qty:1, sold:0, note:""},
            {id:26, cat:"发圈", name:"大蕾丝花边米色波点", spec:"四层16cm", cost:1.99, qty:1, sold:0, note:""},
            {id:27, cat:"发圈", name:"粉色KT蝴蝶结", spec:"/", cost:3.73, qty:1, sold:0, note:""},
            {id:28, cat:"发圈", name:"冰蓝肌理泡泡纱", spec:"4层14cm", cost:2.76, qty:1, sold:0, note:""},
            {id:29, cat:"发圈", name:"粉白蝴蝶结", spec:"双层15cm", cost:2.35, qty:1, sold:0, note:""},
            {id:30, cat:"发圈", name:"双层蓝花边", spec:"/", cost:2.16, qty:1, sold:0, note:""},
            {id:31, cat:"发圈", name:"黄色碎花双层", spec:"双层", cost:2.70, qty:1, sold:0, note:""},
            {id:32, cat:"发圈", name:"黑色缎面波点", spec:"四层15cm", cost:2.75, qty:1, sold:0, note:""},
            {id:33, cat:"发圈", name:"伊甸园嫩黄碎花蕾丝", spec:"约14cm", cost:2.76, qty:1, sold:0, note:""},
            {id:34, cat:"发圈", name:"蓝色条纹云朵棉", spec:"四层18cm", cost:3.04, qty:1, sold:0, note:""},
            {id:35, cat:"发圈", name:"新款藏蓝爱心", spec:"/", cost:2.43, qty:2, sold:0, note:""},
            {id:36, cat:"发圈", name:"温柔奶芙波点双层", spec:"双层", cost:3.86, qty:2, sold:0, note:""},
            {id:37, cat:"发圈", name:"粉双层发圈", spec:"15cm", cost:2.35, qty:2, sold:0, note:""}
        ];

        let products = [];
        let todaySales = [];
        let historySales = [];
        let nextProductId = 200;
        const STORAGE_KEY = 'stall_full_v4';
        const PAGE_SIZE = 8;
        let currentPage = 1;
        let currentMode = null;
        let currentPrice = 0;
        let selectedIds = [];

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    products = data.products || [];
                    todaySales = data.todaySales || [];
                    historySales = data.historySales || [];
                    if (products.length > 0) nextProductId = Math.max(...products.map(p => p.id)) + 1;
                } catch(e) { resetAll(); }
            } else {
                resetAll();
            }
        }

        function resetAll() {
            products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
            todaySales = [];
            historySales = [];
            nextProductId = 200;
            saveAll();
        }

        function saveAll() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ products, todaySales, historySales }));
        }

        function renderStock() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            let filtered = products.filter(p => {
                const matchCat = cat === '全部' || p.cat === cat;
                const matchSearch = p.name.toLowerCase().includes(search) || (p.note && p.note.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = filtered.slice(start, start + PAGE_SIZE);
            let html = '<table><thead><tr><th>类别</th><th>名称</th><th>规格</th><th>成本</th><th>库存</th><th>已售</th><th>操作</th></tr></thead><tbody>';
            if (pageItems.length === 0) {
                html += '<tr><td colspan="7" style="text-align:center; padding:20px;">暂无商品</td></tr>';
            } else {
                pageItems.forEach(p => {
                    html += `<tr>
                        <td>${p.cat}</td><td><strong>${p.name}</strong></td><td>${p.spec||'-'}</td>
                        <td><input class="editable" type="number" value="${p.cost.toFixed(2)}" onchange="updateCost(${p.id}, this.value)" step="0.01"></td>
                        <td style="font-weight:700;">${p.qty}</td><td>${p.sold||0}</td>
                        <td class="action-cell">
                            <button class="icon-btn" onclick="quickStockIn(${p.id})">📥+1</button>
                            <button class="icon-btn" onclick="quickSellOne(${p.id})">📤售出</button>
                            <button class="icon-btn" onclick="editProduct(${p.id})">✏️</button>
                            <button class="icon-btn danger" onclick="deleteProduct(${p.id})">🗑️</button>
                        </td>
                    </tr>`;
                });
            }
            html += '</tbody></table>';
            document.getElementById('stockTable').innerHTML = html;
            let pagHtml = '';
            pagHtml += `<button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ 上一页</button>`;
            pagHtml += `<span style="font-weight:600;">${currentPage} / ${totalPages}</span>`;
            pagHtml += `<button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>下一页 ›</button>`;
            document.getElementById('pagination').innerHTML = pagHtml;
            updateStats();
        }

        function changePage(page) {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            let filtered = products.filter(p => {
                const matchCat = cat === '全部' || p.cat === cat;
                const matchSearch = p.name.toLowerCase().includes(search) || (p.note && p.note.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            currentPage = page;
            renderStock();
        }

        function updateCost(id, val) {
            const p = products.find(x => x.id === id);
            if (p) { p.cost = parseFloat(val) || 0; saveAll(); updateStats(); }
        }

        function quickStockIn(id) {
            const p = products.find(x => x.id === id);
            if (p) { p.qty += 1; saveAll(); renderStock(); }
        }

        function quickSellOne(id) {
            const p = products.find(x => x.id === id);
            if (!p || p.qty <= 0) { alert('库存不足'); return; }
            let price = parseFloat(prompt(`输入售价 (¥)`, p.cat==='工具'?'2':'9.9'));
            if (isNaN(price) || price <= 0) return;
            p.qty -= 1;
            p.sold = (p.sold || 0) + 1;
            todaySales.push({ id: Date.now(), items: [{name: p.name, price: price}], total: price, time: new Date().toLocaleTimeString('zh-CN', {hour12:false}) });
            saveAll();
            renderAll();
        }

        function editProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            document.getElementById('editId').value = p.id;
            document.getElementById('editCategory').value = p.cat;
            document.getElementById('editName').value = p.name;
            document.getElementById('editSpec').value = p.spec || '';
            document.getElementById('editCost').value = p.cost;
            document.getElementById('editQty').value = p.qty;
            document.getElementById('editNote').value = p.note || '';
            document.getElementById('editModalTitle').textContent = '编辑商品';
            document.getElementById('editModal').classList.add('active');
        }

        function openAddModal() {
            document.getElementById('editId').value = '';
            document.getElementById('editCategory').value = '假睫毛';
            document.getElementById('editName').value = '';
            document.getElementById('editSpec').value = '';
            document.getElementById('editCost').value = '0.00';
            document.getElementById('editQty').value = '1';
            document.getElementById('editNote').value = '';
            document.getElementById('editModalTitle').textContent = '添加商品';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveProduct() {
            const id = document.getElementById('editId').value;
            const cat = document.getElementById('editCategory').value;
            const name = document.getElementById('editName').value.trim();
            const spec = document.getElementById('editSpec').value.trim();
            const cost = parseFloat(document.getElementById('editCost').value);
            const qty = parseInt(document.getElementById('editQty').value) || 0;
            const note = document.getElementById('editNote').value.trim();
            if (!name) { alert('名称必填'); return; }
            if (isNaN(cost)) { alert('成本无效'); return; }
            if (id) {
                const p = products.find(x => x.id === parseInt(id));
                if (p) { p.cat = cat; p.name = name; p.spec = spec; p.cost = cost; p.qty = qty; p.note = note; }
            } else {
                products.push({ id: nextProductId++, cat, name, spec, cost, qty, sold:0, note });
            }
            saveAll();
            closeEditModal();
            renderStock();
        }

        function deleteProduct(id) {
            if (confirm('删除该商品？')) {
                products = products.filter(p => p.id !== id);
                saveAll();
                renderStock();
            }
        }

        function openSaleModal(mode, price) {
            currentMode = mode;
            currentPrice = price;
            selectedIds = [];
            let title = '', options = [];
            if (mode === '免胶') {
                title = '选择免胶假睫毛';
                options = products.filter(p => p.cat === '假睫毛' && !p.name.includes('胶水'));
            } else if (mode === '胶水') {
                title = '选择胶水假睫毛';
                options = products.filter(p => p.cat === '假睫毛' && p.name.includes('胶水'));
            } else if (mode === '发圈单') {
                title = '选择一个发圈';
                options = products.filter(p => p.cat === '发圈');
            } else if (mode === '发圈双') {
                title = '选择两个发圈 (可相同)';
                options = products.filter(p => p.cat === '发圈');
            } else if (mode === '镊子') {
                title = '镊子';
                options = products.filter(p => p.name.includes('镊子'));
            }
            document.getElementById('modalTitle').textContent = title;
            renderOptions(options, getMaxSelect(mode));
            document.getElementById('selectionModal').classList.add('active');
        }

        function openComboModal() {
            currentMode = 'combo';
            currentPrice = 16;
            selectedIds = [];
            document.getElementById('modalTitle').textContent = '任选两盒假睫毛';
            const options = products.filter(p => p.cat === '假睫毛');
            renderOptions(options, 2);
            document.getElementById('selectionModal').classList.add('active');
        }

        function getMaxSelect(mode) {
            if (mode === 'combo' || mode === '发圈双') return 2;
            return 1;
        }

        function renderOptions(options, maxSelect) {
            const container = document.getElementById('modalOptions');
            container.innerHTML = '';
            if (options.length === 0) {
                container.innerHTML = '<div style="padding:20px;text-align:center;">无可用商品</div>';
                return;
            }
            options.forEach(p => {
                const div = document.createElement('div');
                div.className = 'select-option';
                div.textContent = `${p.name} (库存:${p.qty})`;
                div.dataset.id = p.id;
                div.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    if (selectedIds.includes(id)) {
                        selectedIds = selectedIds.filter(x => x !== id);
                    } else {
                        if (selectedIds.length >= maxSelect) selectedIds.shift();
                        selectedIds.push(id);
                    }
                    updateOptionHighlights();
                });
                container.appendChild(div);
            });
            updateOptionHighlights();
            document.getElementById('modalConfirm').onclick = function() {
                if (selectedIds.length !== maxSelect) {
                    alert(`请选择 ${maxSelect} 件商品`); return;
                }
                const selectedProducts = selectedIds.map(id => products.find(p => p.id === id)).filter(Boolean);
                for (let p of selectedProducts) {
                    if (p.qty <= 0) { alert(`${p.name} 库存不足`); return; }
                }
                selectedProducts.forEach(p => { p.qty -= 1; p.sold = (p.sold || 0) + 1; });
                const names = selectedProducts.map(p => p.name).join(' + ');
                const itemPrice = currentPrice / selectedProducts.length;
                todaySales.push({
                    id: Date.now(),
                    items: selectedProducts.map(p => ({ name: p.name, price: itemPrice })),
                    total: currentPrice,
                    time: new Date().toLocaleTimeString('zh-CN', {hour12: false}),
                    detail: names
                });
                saveAll();
                closeModal();
                renderAll();
            };
        }

        function updateOptionHighlights() {
            document.querySelectorAll('#modalOptions .select-option').forEach(opt => {
                const id = parseInt(opt.dataset.id);
                if (selectedIds.includes(id)) opt.classList.add('selected');
                else opt.classList.remove('selected');
            });
        }

        function closeModal() {
            document.getElementById('selectionModal').classList.remove('active');
            currentMode = null;
            selectedIds = [];
        }

        function addCustom() {
            const name = prompt('请输入商品名称:', '');
            if (!name) return;
            const priceStr = prompt('请输入金额 (¥):', '');
            if (!priceStr) return;
            const price = parseFloat(priceStr);
            if (isNaN(price) || price <= 0) { alert('金额无效'); return; }
            todaySales.push({ id: Date.now(), items: [{name, price}], total: price, time: new Date().toLocaleTimeString('zh-CN', {hour12:false}) });
            saveAll();
            renderAll();
        }

        function undoLastSale() {
            if (todaySales.length === 0) return;
            const last = todaySales.pop();
            last.items.forEach(item => {
                const p = products.find(x => x.name === item.name);
                if (p) {
                    p.qty += 1;          // 库存恢复
                    p.sold = Math.max((p.sold || 0) - 1, 0);  // 已售减1，最小为0
                }
            });
            saveAll();
            renderAll();
        }

        function settleDay() {
            if (todaySales.length === 0) { alert('今日无销售'); return; }
            if (!confirm('结算今日并清空记录？')) return;
            const total = todaySales.reduce((s, t) => s + t.total, 0);
            historySales.unshift({ date: new Date().toISOString().slice(0,10), total, count: todaySales.length, transactions: [...todaySales] });
            todaySales = [];
            saveAll();
            renderAll();
            alert(`今日结算 ¥${total.toFixed(2)}`);
        }

        function openHistoryModal() { renderHistory(); document.getElementById('historyModal').classList.add('active'); }
        function closeHistoryModal() { document.getElementById('historyModal').classList.remove('active'); }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (historySales.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#b7a089; padding:20px;">暂无历史记录</div>';
                return;
            }
            let html = '';
            historySales.forEach((day, dayIndex) => {
                html += `<div class="history-day">
                    <div style="display:flex; justify-content:space-between; align-items:center;" onclick="toggleDayDetail(${dayIndex})">
                        <strong>${day.date}</strong>
                        <span>¥${day.total.toFixed(2)} (${day.transactions.length}单)</span>
                    </div>
                    <div id="day-detail-${dayIndex}" style="display:none; margin-top:8px;"></div>
                </div>`;
            });
            container.innerHTML = html;
        }

        window.toggleDayDetail = function(dayIndex) {
            const detailDiv = document.getElementById(`day-detail-${dayIndex}`);
            if (detailDiv.style.display === 'none') {
                detailDiv.style.display = 'block';
                renderDayDetail(dayIndex);
            } else {
                detailDiv.style.display = 'none';
            }
        };

        function renderDayDetail(dayIndex) {
            const day = historySales[dayIndex];
            const detailDiv = document.getElementById(`day-detail-${dayIndex}`);
            let html = '';
            day.transactions.forEach((t, tIndex) => {
                html += `<div class="history-transaction" id="hist-tx-${dayIndex}-${tIndex}">
                    <div style="flex:2;">
                        <span>${t.items.map(i=>i.name).join(' + ')}</span>
                        ${t.detail ? `<div class="sale-detail">(${t.detail})</div>` : ''}
                    </div>
                    <input class="edit-input" type="number" value="${t.total.toFixed(2)}" step="0.01" onchange="updateHistoryTx(${dayIndex}, ${tIndex}, this.value)">
                    <button class="icon-btn danger" onclick="deleteHistoryTx(${dayIndex}, ${tIndex})">🗑️</button>
                </div>`;
            });
            html += `<button class="btn small" style="margin-top:8px;" onclick="deleteHistoryDay(${dayIndex})">删除这一天</button>`;
            detailDiv.innerHTML = html;
        }

        window.updateHistoryTx = function(dayIndex, txIndex, newTotal) {
            const val = parseFloat(newTotal);
            if (isNaN(val) || val < 0) return;
            const day = historySales[dayIndex];
            const tx = day.transactions[txIndex];
            const oldTotal = tx.total;
            if (oldTotal > 0) {
                tx.items.forEach(item => { item.price = (item.price / oldTotal) * val; });
            }
            tx.total = val;
            day.total = day.transactions.reduce((sum, t) => sum + t.total, 0);
            saveAll();
            renderHistory();
            const detailDiv = document.getElementById(`day-detail-${dayIndex}`);
            if (detailDiv && detailDiv.style.display === 'block') renderDayDetail(dayIndex);
        };

        window.deleteHistoryTx = function(dayIndex, txIndex) {
            if (!confirm('删除这条交易记录？')) return;
            const day = historySales[dayIndex];
            day.transactions.splice(txIndex, 1);
            if (day.transactions.length === 0) {
                historySales.splice(dayIndex, 1);
            } else {
                day.total = day.transactions.reduce((sum, t) => sum + t.total, 0);
                day.count = day.transactions.length;
            }
            saveAll();
            renderHistory();
        };

        window.deleteHistoryDay = function(dayIndex) {
            if (!confirm('删除这一天的所有记录？')) return;
            historySales.splice(dayIndex, 1);
            saveAll();
            renderHistory();
        };

        function updateStats() {
            const totalStock = products.reduce((s, p) => s + p.qty, 0);
            const totalCost = products.reduce((s, p) => s + p.cost * (p.qty + (p.sold||0)), 0);
            const todayTotal = todaySales.reduce((s, t) => s + t.total, 0);
            const todayCount = todaySales.length;
            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-item"><div class="stat-val">${products.length}</div><div class="stat-label">商品种类</div></div>
                <div class="stat-item"><div class="stat-val">${totalStock}</div><div class="stat-label">总库存</div></div>
                <div class="stat-item"><div class="stat-val">¥${totalCost.toFixed(2)}</div><div class="stat-label">进货成本</div></div>
                <div class="stat-item"><div class="stat-val">¥${todayTotal.toFixed(2)}</div><div class="stat-label">今日销售</div></div>
                <div class="stat-item"><div class="stat-val">${todayCount}</div><div class="stat-label">今日单数</div></div>
            `;
        }

        function renderSaleList() {
            const list = document.getElementById('saleList');
            if (todaySales.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#c5b29b;padding:14px;">暂无销售记录</div>';
                return;
            }
            let html = '';
            todaySales.slice().reverse().forEach(t => {
                const detailStr = t.detail ? `<span class="sale-detail">(${t.detail})</span>` : '';
                html += `<div class="sale-item">
                    <div><div>${t.items.map(i=>i.name).join(' + ')}</div>${detailStr}</div>
                    <div style="text-align:right;"><strong>¥${t.total.toFixed(2)}</strong><div style="font-size:0.7rem;color:#b7a089;">${t.time}</div></div>
                </div>`;
            });
            list.innerHTML = html;
        }

        function renderAll() { renderStock(); renderSaleList(); updateStats(); }

        loadData();
        renderAll();
        document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; renderStock(); });
        document.getElementById('categoryFilter').addEventListener('change', () => { currentPage = 1; renderStock(); });
        document.getElementById('selectionModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
        document.getElementById('historyModal').addEventListener('click', function(e) { if (e.target === this) closeHistoryModal(); });

        window.changePage = changePage;
        window.quickStockIn = quickStockIn;
        window.quickSellOne = quickSellOne;
        window.updateCost = updateCost;
        window.editProduct = editProduct;
        window.deleteProduct = deleteProduct;
        window.openAddModal = openAddModal;
        window.closeEditModal = closeEditModal;
        window.saveProduct = saveProduct;
        window.openSaleModal = openSaleModal;
        window.openComboModal = openComboModal;
        window.closeModal = closeModal;
        window.undoLastSale = undoLastSale;
        window.addCustom = addCustom;
        window.settleDay = settleDay;
        window.openHistoryModal = openHistoryModal;
        window.closeHistoryModal = closeHistoryModal;
        window.toggleDayDetail = toggleDayDetail;
        window.updateHistoryTx = updateHistoryTx;
        window.deleteHistoryTx = deleteHistoryTx;
        window.deleteHistoryDay = deleteHistoryDay;
    })();
</script>
</body>
</html>
